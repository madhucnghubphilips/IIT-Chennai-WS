<!-- The OWASP Top 10 for LLM Applications (2025) training was designed and developed by CN Madhu (madhu.cn@philips.com). This program combines industry-relevant content and practical labs to showcase real-world AI security risks, vulnerabilities, and defense strategies in healthcare environments. -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Healthcare AI Assistant</title>
  <link rel="icon" href="data:,">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root,
    [data-theme="dark"] {
      --bg: #0d1117;
      --bg-elevated: #111827;
      --surface: #151d2b;
      --surface-soft: #1b2638;
      --surface-strong: #223047;
      --text: #f5f7fb;
      --text-muted: #aab5c8;
      --text-faint: #778397;
      --line: rgba(187, 211, 255, 0.14);
      --line-strong: rgba(121, 180, 255, 0.32);
      --accent: #2bb7ff;
      --accent-strong: #54d6ff;
      --accent-soft: rgba(43, 183, 255, 0.16);
      --success: #5ee6a8;
      --warning: #ffd166;
      --danger: #ff6b7a;
      --shadow: 0 18px 55px rgba(0, 0, 0, 0.32);
      --input-bg: #0f1724;
      --image-bg: linear-gradient(145deg, rgba(43, 183, 255, 0.15), rgba(94, 230, 168, 0.08));
    }

    [data-theme="light"] {
      --bg: #f4f8fb;
      --bg-elevated: #ffffff;
      --surface: #ffffff;
      --surface-soft: #eef5fa;
      --surface-strong: #dfeaf2;
      --text: #101827;
      --text-muted: #4f5f73;
      --text-faint: #718096;
      --line: rgba(33, 56, 82, 0.12);
      --line-strong: rgba(0, 116, 166, 0.26);
      --accent: #0073a8;
      --accent-strong: #005f8f;
      --accent-soft: rgba(0, 115, 168, 0.12);
      --success: #168a52;
      --warning: #9b6a00;
      --danger: #c83545;
      --shadow: 0 16px 45px rgba(31, 64, 88, 0.14);
      --input-bg: #ffffff;
      --image-bg: linear-gradient(145deg, rgba(0, 115, 168, 0.12), rgba(22, 138, 82, 0.08));
    }

    html { height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, Ubuntu, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 0.9375rem;
      line-height: 1.55;
      transition: background 0.2s ease, color 0.2s ease;
    }

    button, select, textarea { font: inherit; }

    .app-shell {
      min-height: 100vh;
      min-height: 100dvh;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at top left, rgba(43, 183, 255, 0.16), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(94, 230, 168, 0.1), transparent 30rem),
        var(--bg);
    }

    .topbar {
      height: 68px;
      padding: 0 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg-elevated) 84%, transparent);
      backdrop-filter: blur(16px);
      flex-shrink: 0;
      z-index: 10;
    }

    .brand-block { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .nav-avatar, .msg-avatar {
      width: 34px; height: 34px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: #ffffff; font-size: 0.68rem; font-weight: 800;
      letter-spacing: 0.04em; flex-shrink: 0;
      background: linear-gradient(145deg, #006aa6, #19b7e8);
      box-shadow: 0 8px 24px rgba(25, 183, 232, 0.28);
    }
    .nav-avatar { font-size: 19px; line-height: 1; }
    .brand-copy { min-width: 0; }
    .nav-title {
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .topbar-actions { display: flex; align-items: center; gap: 10px; }
    .status-pill, .theme-toggle {
      border: 1px solid var(--line);
      background: var(--surface-soft);
      color: var(--text-muted);
      border-radius: 999px;
      height: 34px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      font-weight: 650;
      white-space: nowrap;
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--success) 18%, transparent);
    }
    .theme-toggle { cursor: pointer; color: var(--text); }
    .theme-toggle:hover { border-color: var(--line-strong); }

    .workspace-shell {
      flex: 1;
      min-height: 0;
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 22px 22px 14px;
      display: grid;
      grid-template-columns: minmax(260px, 320px) minmax(0, 1fr);
      gap: 18px;
    }

    .mission-progress {
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      box-shadow: var(--shadow);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow: auto;
    }

    .panel-kicker {
      color: var(--accent-strong);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .mission-heading {
      font-size: 1.22rem;
      line-height: 1.18;
      margin-top: 5px;
      letter-spacing: 0;
    }
    .mission-copy {
      color: var(--text-muted);
      font-size: 0.84rem;
      margin-top: 8px;
    }

    .controls-bar { display: contents; }
    .mode-controls { display: grid; gap: 12px; }
    .field-group { display: grid; gap: 6px; }
    .nav-label {
      font-size: 0.72rem;
      color: var(--text-faint);
      font-weight: 750;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      user-select: none;
    }
    .scenario-select {
      width: 100%;
      min-height: 42px;
      font-size: 0.88rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 11px;
      background: var(--input-bg);
      color: var(--text);
      cursor: pointer;
      outline: none;
    }
    .scenario-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .chat-column {
      min-width: 0;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #chat-main {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 22px;
    }
    .messages-wrap {
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0;
    }


    .active-challenge {
      position: sticky;
      top: 0;
      z-index: 3;
      max-width: 820px;
      width: 100%;
      margin: 0 auto 16px;
      border: 1px solid var(--line-strong);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      background: color-mix(in srgb, var(--surface-soft) 94%, var(--bg));
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.16);
      padding: 12px 14px;
    }
    .active-challenge.hidden { display: none; }
    .active-challenge-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
    }
    .active-challenge-kicker {
      color: var(--accent-strong);
      font-size: 0.68rem;
      font-weight: 820;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }
    .active-challenge-level {
      color: var(--text-faint);
      font-size: 0.72rem;
      font-weight: 760;
      white-space: nowrap;
    }
    .active-challenge-title {
      color: var(--text);
      font-size: 0.96rem;
      line-height: 1.25;
      font-weight: 780;
      margin-bottom: 5px;
    }
    .active-challenge-subtitle {
      color: var(--text-faint);
      font-size: 0.76rem;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 7px;
    }
    .active-challenge-description {
      color: var(--text-muted);
      font-size: 0.8rem;
      line-height: 1.45;
      margin-bottom: 10px;
    }
    .active-challenge-detail-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(220px, 0.9fr);
      gap: 10px;
    }
    .active-challenge-label {
      display: block;
      color: var(--accent-strong);
      font-size: 0.65rem;
      font-weight: 820;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 3px;
    }
    .active-challenge-objective {
      color: var(--text-muted);
      font-size: 0.82rem;
      line-height: 1.45;
    }
    .active-challenge-hint {
      color: var(--text-faint);
      font-size: 0.78rem;
      line-height: 1.4;
      white-space: pre-line;
    }
    .active-challenge-explanation {
      display: block;
      color: var(--text-faint);
      font-size: 0.76rem;
      line-height: 1.45;
      margin-top: 6px;
    }
    .active-challenge-status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }
    .active-challenge-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--success);
      font-size: 0.78rem;
      font-weight: 760;
    }
    .active-challenge-status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--success) 18%, transparent);
    }
    .active-challenge-next {
      margin-left: auto;
    }
    .msg-user { display: flex; justify-content: flex-end; margin-bottom: 18px; }
    .msg-user .content {
      max-width: min(640px, 86%);
      background: linear-gradient(145deg, var(--accent), var(--accent-strong));
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.94rem;
      color: #00131f;
      font-weight: 600;
      white-space: pre-wrap;
      word-break: break-word;
    }
    [data-theme="dark"] .msg-user .content { color: #03111b; }
    [data-theme="light"] .msg-user .content { color: #ffffff; }

    .msg-assistant {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 22px;
    }
    .msg-avatar {
      width: 32px;
      height: 32px;
      font-size: 0.62rem;
      margin-top: 2px;
    }
    .msg-assistant .content {
      flex: 1;
      min-width: 0;
      font-size: 0.94rem;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-left: 4px solid transparent;
      border-radius: 8px;
      background: var(--surface-soft);
    }
    .accent-pi  { border-left-color: #2bb7ff !important; }
    .accent-sd  { border-left-color: #ffbd4a !important; }
    .accent-oh  { border-left-color: #ff6580 !important; }
    .accent-mi  { border-left-color: #5ee6a8 !important; }
    .accent-dp  { border-left-color: #b38cff !important; }
    .accent-uc  { border-left-color: #f97316 !important; }

    .msg-assistant .content.atm-output {
      white-space: normal;
    }
    .atm-output-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .atm-output-summary-copy { min-width: 0; }
    .atm-output-summary-title { color: var(--text); font-weight: 820; }
    .atm-output-summary-note { margin-top: 2px; color: var(--text-muted); font-size: 0.78rem; }
    .atm-output-open {
      flex-shrink: 0;
      min-height: 36px;
      padding: 7px 11px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: var(--surface-strong);
      color: var(--text);
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 780;
    }
    .atm-output-open:hover { border-color: var(--accent); }
    .atm-output-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(2, 8, 14, 0.72);
      backdrop-filter: blur(7px);
    }
    .atm-output-modal {
      width: min(900px, calc(100vw - 32px));
      max-height: min(90vh, 860px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
      border: 1px solid #7d8b94;
      border-radius: 8px;
      background: #b8c1c7;
      box-shadow: 0 30px 100px rgba(0, 0, 0, 0.5);
    }
    .atm-output-modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 14px;
      border-bottom: 1px solid #78858d;
      background: linear-gradient(145deg, #eef2f4, #b7c0c6);
      color: #172126;
    }
    .atm-output-modal-title { min-width: 0; font-size: 0.88rem; font-weight: 850; }
    .atm-output-close {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      border: 1px solid #6e7a82;
      border-radius: 50%;
      background: #f4f6f7;
      color: #172126;
      cursor: pointer;
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1;
    }
    .atm-output-close:hover { border-color: #1f6fa5; color: #005f8f; }
    .atm-output-close:focus-visible { outline: 3px solid #2bb7ff; outline-offset: 2px; }
    .atm-output-modal-body { min-height: 0; overflow: auto; padding: 14px; }
    .atm-machine-shell {
      width: 100%;
      padding: 14px;
      border: 1px solid #84919a;
      border-radius: 8px;
      background: linear-gradient(145deg, #e8edf0 0%, #a9b3ba 48%, #d9dfe3 100%);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }
    .atm-screen {
      position: relative;
      overflow: hidden;
      padding: 18px;
      border: 4px solid #29343a;
      border-radius: 6px;
      background: #03100a;
      color: #aaffbf;
      font-family: Consolas, 'Courier New', monospace;
      box-shadow: inset 0 0 28px rgba(30, 255, 115, 0.08);
    }
    .atm-screen::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom, transparent 0, transparent 3px, rgba(130, 255, 170, 0.025) 4px);
    }
    .atm-screen-header,
    .atm-screen-footer {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .atm-bank-name { color: #e5ffeb; font-size: 0.78rem; font-weight: 800; letter-spacing: 0.08em; }
    .atm-session-state { display: inline-flex; align-items: center; gap: 7px; color: #76f99c; font-size: 0.7rem; font-weight: 700; }
    .atm-session-state::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #55ff89; box-shadow: 0 0 8px #55ff89; }
    .atm-screen-title {
      position: relative;
      z-index: 1;
      margin: 15px 0 12px;
      padding-block: 10px;
      border-block: 1px solid rgba(144, 255, 177, 0.3);
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-align: center;
    }
    .atm-command-list { position: relative; z-index: 1; display: grid; gap: 5px; }
    .atm-command-row {
      display: grid;
      grid-template-columns: 2.2rem minmax(0, 1fr) auto;
      align-items: center;
      gap: 9px;
      min-height: 30px;
      padding: 5px 8px;
      border-left: 2px solid rgba(91, 255, 137, 0.45);
      background: rgba(86, 255, 137, 0.045);
    }
    .atm-command-number { color: #5fc879; font-size: 0.7rem; }
    .atm-command-code { min-width: 0; overflow-wrap: anywhere; color: #c8ffd5; font-size: 0.78rem; font-weight: 700; }
    .atm-command-ready { color: #63e987; font-size: 0.66rem; font-weight: 800; }
    .atm-screen-footer { margin-top: 14px; padding-top: 10px; border-top: 1px solid rgba(144, 255, 177, 0.3); color: #67d987; font-size: 0.68rem; }
    .atm-card-slot { width: 64px; height: 6px; margin: 11px auto 0; border-radius: 2px; background: #4a565d; box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.65); }

    /* ── UC1 Resource Monitor ───────────────────────────────────────── */
    .uc-resource-panel {
      margin: 10px 0 4px;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-left: 4px solid #f97316;
      border-radius: 10px;
      background: rgba(249,115,22,0.05);
      font-size: 0.8rem;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      color: var(--text-muted);
      display: none;
    }
    .uc-resource-panel.uc-visible { display: block; }
    .uc-res-title { font-weight: 800; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: #f97316; margin-bottom: 7px; }
    .uc-res-row { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 3px; }
    .uc-res-val { font-weight: 700; color: var(--text); }
    .uc-status-stable   { color: var(--success, #5ee6a8); font-weight: 700; }
    .uc-status-warning  { color: var(--warning, #ffd166); font-weight: 700; }
    .uc-status-unstable { color: var(--danger,  #ff6b7a); font-weight: 800; }

    .msg-assistant .content.error {
      color: var(--danger);
      background: color-mix(in srgb, var(--danger) 10%, var(--surface));
      border-color: color-mix(in srgb, var(--danger) 35%, var(--line));
    }
    .oh-unsanitized-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 750;
      color: #5b3b00;
      background: #ffe8a3;
      border: 1px solid #ffd166;
      border-radius: 5px;
      padding: 3px 8px;
      margin-bottom: 8px;
    }

    .success-banner {
      max-width: 820px;
      margin: 0 auto 16px;
      background: color-mix(in srgb, var(--success) 14%, var(--surface));
      border: 1px solid color-mix(in srgb, var(--success) 45%, var(--line));
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.86rem;
      color: var(--success);
      font-weight: 750;
      animation: slideIn 0.3s ease;
    }
    .success-banner .credential {
      font-family: monospace;
      font-weight: 800;
      background: color-mix(in srgb, var(--success) 16%, transparent);
      padding: 2px 7px;
      border-radius: 5px;
    }
    .next-challenge-btn {
      margin-left: auto;
      font-size: 0.8rem;
      background: var(--accent);
      border: 1px solid color-mix(in srgb, var(--accent) 55%, var(--line));
      color: #ffffff;
      border-radius: 8px;
      padding: 7px 12px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      flex-shrink: 0;
    }
    .next-challenge-btn:hover { filter: brightness(1.05); }
    .mark-solved-btn {
      font-size: 0.8rem;
      background: color-mix(in srgb, var(--success) 12%, var(--surface));
      border: 1px solid color-mix(in srgb, var(--success) 45%, var(--line));
      color: var(--success);
      border-radius: 8px;
      padding: 6px 11px;
      cursor: pointer;
      margin-top: 6px;
      font-family: inherit;
      font-weight: 700;
    }
    .mark-solved-btn:hover { border-color: var(--success); }
    .mcq-panel { display: grid; gap: 8px; margin-top: 14px; }
    .mcq-question { color: var(--text); font-weight: 750; font-size: 0.88rem; }
    .mcq-options { display: grid; gap: 7px; }
    .mcq-option { width: 100%; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-soft); color: var(--text); cursor: pointer; transition: border-color .15s, transform .15s, background .15s; }
    .mcq-option:hover { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-1px); }
    .mcq-option-key { display: inline-flex; width: 22px; height: 22px; margin-right: 8px; align-items: center; justify-content: center; border-radius: 5px; background: var(--accent-soft); color: var(--accent-strong); font-size: .74rem; font-weight: 800; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .typing { display: inline-flex; gap: 4px; align-items: center; padding: 4px 0; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
      animation: pulse 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 60%, 100% { transform: scale(1); opacity: 0.45; }
      30% { transform: scale(1.35); opacity: 1; }
    }

    .input-wrap {

      if (localStorage.getItem(PI4_LAYOUT_MIGRATION_KEY) === '1') return;

      const reassignedScenarios = ['pi_4', 'pi_8', 'ea_8'];
      const histories = JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}');
      const progress = JSON.parse(localStorage.getItem('ctf_progress') || '{}');
      reassignedScenarios.forEach((key) => {
        delete histories[key];
        delete progress[key];
      });
      localStorage.setItem(HISTORY_KEY, JSON.stringify(histories));
      localStorage.setItem('ctf_progress', JSON.stringify(progress));

      if (['pi_8', 'ea_8'].includes(localStorage.getItem(SCENARIO_KEY))) {
        localStorage.setItem(SCENARIO_KEY, 'pi_4');
      }
      localStorage.setItem(PI4_LAYOUT_MIGRATION_KEY, '1');
    }

    function migrateLlm08ChallengeOrder() {
      if (localStorage.getItem(LLM08_CHALLENGE_ORDER_MIGRATION_KEY) === '1') return;
      const histories = JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}');
      const progress = JSON.parse(localStorage.getItem('ctf_progress') || '{}');
      // Catch-Up briefly occupied sp_1 during development. Clear both LLM08
      // conversations so restored Challenge 1 and new Challenge 2 never mix.
      delete histories.sp_1;
      delete histories.sp_2;
      delete progress.sp_1;
      delete progress.sp_2;
      localStorage.setItem(HISTORY_KEY, JSON.stringify(histories));
      localStorage.setItem('ctf_progress', JSON.stringify(progress));
      localStorage.setItem(LLM08_CHALLENGE_ORDER_MIGRATION_KEY, '1');
    }

    function setSidebarOpen(open) {
      isSidebarOpen = Boolean(open);
      const shell = document.querySelector('.app-shell');
      const toggle = document.getElementById('sidebar-toggle');
      if (shell) shell.dataset.sidebar = isSidebarOpen ? 'open' : 'closed';
      if (toggle) {
        toggle.setAttribute('aria-expanded', String(isSidebarOpen));
        toggle.setAttribute('aria-label', isSidebarOpen ? 'Close mission control' : 'Open mission control');
      }
      if (persistSidebarState) {
        localStorage.setItem(SIDEBAR_KEY, isSidebarOpen ? '1' : '0');
      }
    }

    function toggleSidebar() {
      setSidebarOpen(!isSidebarOpen);
    }

    function setTheme(theme) {
      const nextTheme = theme === 'light' ? 'light' : 'dark';
      document.documentElement.dataset.theme = nextTheme;
      localStorage.setItem(THEME_KEY, nextTheme);
      const btn = document.getElementById('theme-toggle');
      if (btn) {
        const isLight = nextTheme === 'light';
        btn.textContent = isLight ? 'Dark mode' : 'Light mode';
        btn.setAttribute('aria-pressed', String(isLight));
      }
    }

    function toggleTheme() {
      setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
    }

    function resetDemoProgress() {
      const confirmed = window.confirm('Reset all challenge progress and chat history for this browser?');
      if (!confirmed) return;
      localStorage.removeItem('ctf_progress');
      ['dp_1', 'dp_2', 'dp_3', 'dp_4', 'dp_8'].forEach((scen) => localStorage.removeItem('adas_' + scen + '_artifact'));
      localStorage.removeItem(HISTORY_KEY);
      localStorage.removeItem(SCENARIO_KEY);
      localStorage.removeItem(MRI_MAINTENANCE_UPLOAD_KEY);
      localStorage.removeItem(SC1_STATE_KEY);

      document.getElementById('ctf-level').value = '1';
      updateCtfScenario();
      renderProgress();
      resetChat();
      document.getElementById('message-input').focus();

      pi: [1, 2, 3, 4, 5],
      sd: [1, 3, 2, 4],
      sc: [1],
      dp: [2, 1, 3, 8],
      oh: [2, 4],

    const DIFFICULTY_LABELS = ['', 'Easy', 'Moderate', 'Medium', 'Hard', 'Nightmare'];

    function difficultyLabel(value) {
      return DIFFICULTY_LABELS[value] || 'Unrated';
    }

    function difficultyPips(c) {
      const topicChallengeCount = Math.max(1, availableLevels(c.owaspCat).length);
      return Array.from({ length: topicChallengeCount }, (_, i) =>
        `<span class="diff-pip${i < c.diff ? ' on' : ''}"></span>`).join('');
    }

    // ── Progress ─────────────────────────────────────────────────────────────
    function getProgress() {
      return JSON.parse(localStorage.getItem('ctf_progress') || '{}');
    }

    function getScenarioHistory() {
      return JSON.parse(localStorage.getItem(HISTORY_KEY) || '{}');
    }

    function saveScenarioHistory() {
      const histories = getScenarioHistory();
      histories[scenario] = history;
      localStorage.setItem(HISTORY_KEY, JSON.stringify(histories));
    }

    function loadScenarioHistory(scen) {
      const histories = getScenarioHistory();
      return Array.isArray(histories[scen]) ? histories[scen] : [];
    }

    function markComplete(scen) {
      sessionCompletions[scen] = true;
      const p = getProgress();
      p[scen] = true;
      localStorage.setItem('ctf_progress', JSON.stringify(p));
      renderProgress();
      updateDropdownLabels();
      const active = document.getElementById('active-challenge');
      if (active && !active.classList.contains('hidden') && scen === scenario) renderActiveChallenge(true);
    }

    function renderProgress() {
      updateDropdownLabels();
    }


    function updateDropdownLabels() {
      const levelSel = document.getElementById('ctf-level');
      Array.from(levelSel.options).forEach((opt, i) => {
        opt.text = `Challenge ${i + 1}`;
      });
    }

    function availableLevels(cat, maxLevel) {
      const explicitlyVisible = VISIBLE_LEVELS[cat];
      if (explicitlyVisible) {
        return explicitlyVisible.filter((level) => Boolean(CTF_CHALLENGES[cat + '_' + level]));
      }
      return Object.keys(CTF_CHALLENGES)
        .filter((key) => key.startsWith(cat + '_'))
        .map((key) => Number(key.split('_')[1]))
        .filter((level) => Number.isFinite(level) && level <= maxLevel)
        .sort((a, b) => a - b);
    }

    function displayChallengeNumber(scen) {
      const [cat, levelRaw] = String(scen).split('_');
      const levels = availableLevels(cat);
      const index = levels.indexOf(Number(levelRaw));
      return index >= 0 ? index + 1 : Number(levelRaw || 1);
    }
    function updateLevelOptions() {
      const categorySel = document.getElementById('ctf-category');
      const levelSel = document.getElementById('ctf-level');
      const cat = categorySel.value;
      const selected = categorySel.options[categorySel.selectedIndex];
      const levelCount = Number(selected.dataset.levelCount || 4);
      const levels = availableLevels(cat, levelCount);
      const current = Number(levelSel.value || levels[0] || 1);
      const options = levels.length ? levels : Array.from({ length: levelCount }, (_, i) => i + 1);
      levelSel.innerHTML = '';
      options.forEach((level, i) => {
        const opt = document.createElement('option');
        opt.value = String(level);
        opt.textContent = 'Challenge ' + (i + 1);
        levelSel.appendChild(opt);
      });
      const nextValue = options.includes(current) ? current : options[0];
      levelSel.value = String(nextValue);
      const challengeGroup = document.getElementById('ctf-level')?.closest('.field-group');
      if (challengeGroup) challengeGroup.style.display = options.length === 1 ? 'none' : '';
      const sc1ViewGroup = document.getElementById('sc1-view-group');
      if (sc1ViewGroup) {
        sc1ViewGroup.style.display = cat === 'sc' ? '' : 'none';
        const sc1ViewSel = document.getElementById('sc1-view-select');
        if (sc1ViewSel) sc1ViewSel.value = sc1View;
      }
    }

    // ── Scenario ─────────────────────────────────────────────────────────────
    function updateCtfScenario() {
      sc1View = 'lab';
      updateLevelOptions();
      const cat   = document.getElementById('ctf-category').value;
      const level = document.getElementById('ctf-level').value;
      scenario = `${cat}_${level}`;
      localStorage.setItem(SCENARIO_KEY, scenario);
      sc1UpgradeToken++;
      updateBrandTitle(cat);
      updateDropdownLabels();
    }

    document.getElementById('ctf-category').addEventListener('change', () => {
      updateCtfScenario(); resetChat();
      if (document.getElementById('ctf-category').value === 've') showVectorPoisoningDisclaimer();
    });
    document.getElementById('ctf-level').addEventListener('change', () => {
      updateCtfScenario(); resetChat();
    });
    document.getElementById('sc1-view-select')?.addEventListener('change', (e) => {
      setSc1View(e.target.value);
    });


    function shouldKeepAdasArtifactWorkspaceVisible(scen) {
      return ['dp_1', 'dp_2', 'dp_3', 'dp_4', 'dp_8'].includes(scen);
    }

    function keepAdasArtifactWorkspaceVisible(scen) {
      if (!shouldKeepAdasArtifactWorkspaceVisible(scen)) return false;
      document.querySelector('.chat-column').dataset.chatMode = 'conversation';
      const welcome = document.getElementById('welcome');
      welcome.classList.remove('hidden');
      renderWelcome();
      renderActiveChallenge(false);
      return true;
    }
    function resetChat() {
      history = loadScenarioHistory(scenario);
      hideUcPanel();
      const messages = document.getElementById('messages-wrap');
      messages.innerHTML = '';
      document.querySelector('.chat-column').dataset.chatMode = history.length ? 'conversation' : 'welcome';
      const welcome = document.getElementById('welcome');
      if (history.length && !shouldKeepAdasArtifactWorkspaceVisible(scenario)) {
        welcome.classList.add('hidden');
      } else {
        welcome.classList.remove('hidden');
        renderWelcome();
      }
      renderHistory();
      renderActiveChallenge(Boolean(history.length) && !shouldKeepAdasArtifactWorkspaceVisible(scenario));
    }

    function nextScenarioKey(scen) {
      const [cat, levelRaw] = String(scen).split('_');
      const level = Number(levelRaw || 0);
      if (!cat || !level) return null;
      const levels = availableLevels(cat);
      const currentIndex = levels.indexOf(level);
      const nextLevel = currentIndex >= 0 ? levels[currentIndex + 1] : null;
      return nextLevel ? cat + '_' + nextLevel : null;
    }

    function goToNextChallenge(scen) {
      const nextKey = nextScenarioKey(scen);
      if (!nextKey) return;
      const [cat, level] = nextKey.split('_');
      document.getElementById('ctf-category').value = cat;
      updateLevelOptions();
      document.getElementById('ctf-level').value = level;
      updateCtfScenario();
      resetChat();
      document.getElementById('message-input').focus();
    }

    // ── Welcome screen ────────────────────────────────────────────────────────
    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Escapes brief text, then renders **inline bold** markers (safe: escaping runs first).
    function renderBrief(c) {
      const html = esc(c.brief).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      return c.boldBrief ? `<strong>${html}</strong>` : html;
    }

    function updateMriMaintenanceClearanceScore(csvText, predictedScore) {
      const score = Number(predictedScore);
      if (!Number.isFinite(score)) return csvText;

      const lineEnding = String(csvText).includes('\r\n') ? '\r\n' : '\n';
      const lines = String(csvText).split(/\r?\n/);
      if (lines.length < 2) return csvText;

      const header = lines[0].split(',');
      const deviceIndex = header.indexOf('DeviceID');
      const clearanceIndex = header.indexOf('SafetyClearanceScore');
      if (deviceIndex < 0 || clearanceIndex < 0) return csvText;

      let updatedTarget = false;
      const updatedLines = lines.map((line, index) => {
        if (index === 0 || !line.trim()) return line;
        const columns = line.split(',');
        if (columns[deviceIndex] === 'MRI-INGENIA-1337' && columns.length > clearanceIndex) {
          columns[clearanceIndex] = score.toFixed(2);
          updatedTarget = true;
          return columns.join(',');
        }
        return line;
      });

      return updatedTarget ? updatedLines.join(lineEnding) : csvText;
    }

        return {

          label: 'Download uploaded CSV',
        };
      }
      return {
        href: upload ? upload.baselineUrl : '#',
        label: 'Download baseline CSV',
      };
    }

    function getLlm08TemplateState(scen = scenario) {
      const states = getLlm08TemplateStates();
      const state = states[scen] || null;
      if (state?.status === 'loading' && !LLM08_ACTIVE_LOADS.has(scen)) {
        const recovered = { ...state, status: 'uploaded' };
        states[scen] = recovered;
        localStorage.setItem(LLM08_TEMPLATE_STATE_KEY, JSON.stringify(states));
        return recovered;
      }
      return state;
    }

      const states = getLlm08TemplateStates();
      states[scen] = state;
      localStorage.setItem(LLM08_TEMPLATE_STATE_KEY, JSON.stringify(states));
    }

    function utf8ToBase64(value) {
      const bytes = new TextEncoder().encode(value);
      let binary = '';
      bytes.forEach((byte) => { binary += String.fromCharCode(byte); });
      return btoa(binary);
    }

    function ve1ParseDirectory(content) {
      let data;
      try { data = JSON.parse(content); }
      catch (_) { return { ok: false, error: 'The uploaded file is not valid JSON.' }; }
      if (!data || typeof data !== 'object' || Array.isArray(data)) return { ok: false, error: 'The hospital directory must be a JSON object.' };
      if (String(data.dataset || '').trim() !== 'hospital_directory') return { ok: false, error: 'This file is not a CityCare hospital directory (dataset must be "hospital_directory").' };
      if (!Array.isArray(data.records)) return { ok: false, error: 'The hospital directory is missing its records array.' };
      const byId = {};
      data.records.forEach((r) => { if (r && typeof r === 'object' && typeof r.record_id === 'string') byId[r.record_id] = r; });
      const missing = ['ROOM-101', 'ROOM-102', 'DOCTOR-SMITH', 'EMERGENCY-CONTACT'].filter((id) => !byId[id]);
      if (missing.length) return { ok: false, error: 'The hospital directory does not contain all required records (missing: ' + missing.join(', ') + ').' };
      const smith = byId['DOCTOR-SMITH'];
      for (const f of ['name', 'specialty', 'room', 'building']) {
        if (typeof smith[f] !== 'string' || !smith[f].trim()) return { ok: false, error: 'The DOCTOR-SMITH record is missing required fields (name, specialty, room, building).' };
      }
      return { ok: true, byId, smith };
    }

    function ve1LoadedSmith(scen = 've_1') {

      if (!state || state.status !== 'loaded' || !state.content) return null;

    function getLlm05OtpState() {
      try { return JSON.parse(localStorage.getItem(LLM05_OTP_STATE_KEY) || '{}'); }
      catch (_) { return {}; }
    }

    function saveLlm05OtpState(state) {
      localStorage.setItem(LLM05_OTP_STATE_KEY, JSON.stringify(state || {}));
    }

    function maskLlm05Contact(value) {
      const contact = String(value || '').trim();
      if (contact.includes('@')) {
        const [name, domain] = contact.split('@');
        return `${name.slice(0, 2)}***@${domain || 'example.com'}`;
      }
      const digits = contact.replace(/\D/g, '');
      return digits.length >= 4 ? `+91-XXXXXX${digits.slice(-4)}` : 'registered contact';
    }

    function isLlm05EmailOrPhoneMentioned(value) {
      const contact = String(value || '').trim();
      const digits = contact.replace(/\D/g, '');
      const emailLike = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact);
      const phoneLike = digits.length >= 10;
      return Boolean(contact && (emailLike || phoneLike));
    }

    function findLlm05Contact(value) {
      if (!isLlm05EmailOrPhoneMentioned(value)) return null;
      const contact = String(value || '').trim().toLowerCase();
      const digits = contact.replace(/\D/g, '');
      const records = [
        { email: 'user.primary@example.com', phone: '+91-9876543242', order: 'ORD-EC-1001' },
        { email: 'user.secondary@example.com', phone: '+91-9765432118', order: 'ORD-EC-1002' },
        { email: 'user.tertiary@example.com', phone: '+91-9123456701', order: 'ORD-EC-1003' },
        { email: 'user.quaternary@example.com', phone: '+91-9988776655', order: 'ORD-EC-1004' },
        { email: 'user.quinary@example.com', phone: '+91-9090901122', order: 'ORD-EC-1005' },
        { email: 'user.senary@example.com', phone: '+91-9345678902', order: 'ORD-EC-1006' },
      ];
      return records.find((record) => contact === record.email || (digits && digits === record.phone.replace(/\D/g, '')));
    }

    function showLlm05OtpToast({ otp = '', message = '', error = false } = {}) {
      let toast = document.getElementById('llm05-otp-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'llm05-otp-toast';
        toast.className = 'llm05-otp-toast';
        toast.setAttribute('role', 'status');
        toast.setAttribute('aria-live', 'polite');
        document.body.appendChild(toast);
      }
      toast.className = `llm05-otp-toast${error ? ' error' : ''}`;
      toast.innerHTML = otp
        ? `<span class="llm05-otp-toast-label">Training OTP</span><span class="llm05-otp-toast-coderow"><span class="llm05-otp-toast-code">${esc(otp)}</span><button type="button" class="llm05-otp-copy" onclick="copyLlm05Otp('${esc(otp)}', this)" aria-label="Copy OTP to clipboard">Copy</button></span><span class="llm05-otp-toast-message">${esc(message || 'Copy this code and verify it in the order lookup panel.')}</span>`
        : `<span class="llm05-otp-toast-label">OTP notice</span><span class="llm05-otp-toast-message">${esc(message)}</span>`;
      const dismissMs = otp ? 15000 : 4500;
      requestAnimationFrame(() => toast.classList.add('visible'));
      scheduleLlm05OtpToastDismiss(toast, dismissMs);
      toast.onmouseenter = () => window.clearTimeout(llm05OtpToastTimer);
      toast.onmouseleave = () => scheduleLlm05OtpToastDismiss(toast, 3000);
    }

    function scheduleLlm05OtpToastDismiss(toast, ms) {
      window.clearTimeout(llm05OtpToastTimer);
      llm05OtpToastTimer = window.setTimeout(() => {
        toast.classList.remove('visible');
        window.setTimeout(() => {
          if (!toast.classList.contains('visible')) toast.remove();
        }, 220);
      }, ms);
    }

    function copyLlm05Otp(code, btn) {
      const flash = () => {
        if (!btn) return;
        const original = btn.textContent;
        btn.textContent = 'Copied';
        btn.classList.add('copied');
        window.setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1400);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(flash).catch(() => fallbackCopyLlm05Otp(code, flash));
      } else {
        fallbackCopyLlm05Otp(code, flash);
      }
    }

    function fallbackCopyLlm05Otp(text, done) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (_) { /* ignore */ }
      ta.remove();
      if (done) done();
    }

    function resetLlm05Otp() {
      saveLlm05OtpState({});
      setLlm05OtpStatus('OTP session reset. Generate a new OTP to continue.');
      refreshLlm05OtpPanels();
    }

    function getLlm05OtpPanel(trigger) {
      return trigger?.closest?.('[data-llm05-otp-panel]') || document;
    }

    function setLlm05OtpStatus(message) {
      document.querySelectorAll('[data-llm05-otp-status]').forEach((node) => {
        node.textContent = message;
      });
    }

    function sendLlm05Otp(trigger) {
      const panel = getLlm05OtpPanel(trigger);
      const input = panel.querySelector('[data-llm05-otp-contact]') || document.querySelector('[data-llm05-otp-contact]');
      const contact = input ? input.value.trim() : '';
      if (!isLlm05EmailOrPhoneMentioned(contact)) {
        const message = 'Enter a registered email address or phone number before sending an OTP.';
        setLlm05OtpStatus(message);
        showLlm05OtpToast({ message, error: true });
        input?.focus();
        return;
      }
      const record = findLlm05Contact(contact);
      if (!record) {
        const message = 'No fictional order is linked to that phone number or email.';
        setLlm05OtpStatus(message);
        showLlm05OtpToast({ message, error: true });
        return;
      }
      const otp = String(Math.floor(100000 + Math.random() * 900000));
      const state = { contact, masked: maskLlm05Contact(contact), otp, verified: false, expiresAt: Date.now() + 5 * 60 * 1000 };
      saveLlm05OtpState(state);
      setLlm05OtpStatus(`OTP sent to ${state.masked}. Use the temporary OTP box at the top to verify.`);
      showLlm05OtpToast({ otp, message: `Sent to ${state.masked}. This box disappears in a few seconds.` });
      refreshLlm05OtpPanels();
    }
    function verifyLlm05Otp(trigger) {
      const state = getLlm05OtpState();
      const panel = getLlm05OtpPanel(trigger);
      const input = panel.querySelector('[data-llm05-otp-code]') || document.querySelector('[data-llm05-otp-code]');
      const code = input ? input.value.trim() : '';
      if (!state.otp) {
        setLlm05OtpStatus('Generate an OTP before verifying.');
        return;
      }
      if (Date.now() > Number(state.expiresAt || 0)) {
        saveLlm05OtpState({});
        setLlm05OtpStatus('OTP expired. Generate a new one.');
        refreshLlm05OtpPanels();
        return;
      }
      if (code === state.otp) {
        saveLlm05OtpState({ ...state, verified: true, otp: '' });
        setLlm05OtpStatus('Verified. The chatbot can now show the allowed order-status card.');
        refreshLlm05OtpPanels();
        return;
      }
      setLlm05OtpStatus('Invalid OTP.');
    }

    function isLlm05OtpVerified() {
      const state = getLlm05OtpState();
      if (!state.verified) return false;
      if (Number(state.expiresAt || 0) && Date.now() > Number(state.expiresAt || 0)) {
        saveLlm05OtpState({});
        return false;
      }
      return true;
    }

    function refreshLlm05OtpPanels() {
      renderWelcome();
      const active = document.getElementById('active-challenge');
      if (active && !active.classList.contains('hidden')) renderActiveChallenge(true);
    }

    function renderLlm05OtpPanel(mode = 'full') {
      if (!scenario.startsWith('oh_')) return '';
      const compact = mode === 'compact';
      const state = getLlm05OtpState();
      const verified = Boolean(state.verified);

      const statusText = verified
        ? `Verified session: ${masked}`
        : (state.otp ? `OTP sent to ${masked}. Enter the code from the temporary top box.` : 'OTP verification required before chat completion.');
      if (compact && verified) {
        return `
          <div class="llm05-otp-compact-chip" data-llm05-otp-panel>
            <span>OTP verified</span>
            <strong>${esc(masked)}</strong>
          </div>`;
      }
      if (compact) {

    function renderCouponCatalogueOverlay(raw) {
      const holder = document.createElement('div');
      holder.innerHTML = raw;
      const coupons = Array.from(holder.querySelectorAll('li')).map((li) => {
        const code = (li.querySelector('strong')?.textContent || '').trim();
        const desc = li.textContent.replace(code, '').replace(/^\s*[—–-]\s*/, '').trim();
        const restricted = /internal|restricted|loyalty|hidden|allocation|eligibility|campaign/i.test(desc);
        return { code, desc, restricted };
      });
      const textOnly = raw.replace(/<section[\s\S]*?<\/section>/i, '\n');
      const lineFor = (label) => {
        const hit = textOnly.split('\n').find((l) => l.trim().toLowerCase().startsWith(label.toLowerCase()));
        return hit ? hit.split(':').slice(1).join(':').trim() : '';
      };
      const cardsHtml = coupons.map((c) => `

          <div class="oh4-coupon-desc">${esc(c.desc)}</div>
        </div>`).join('');
      const metaRow = (label, text, kind) => text
        ? `<div class="oh4-meta-row oh4-meta-${kind}"><span>${esc(label)}</span><p>${esc(text)}</p></div>`
        : '';

    // One-time explainer shown when the user enters the LLM09 (vector/embedding) domain.
    function showVectorPoisoningDisclaimer() {
      if (document.getElementById('ve-disclaimer-overlay')) return;
      const dbIcon = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>';

      overlay.innerHTML = `
        <section class="ve-disclaimer-modal" role="dialog" aria-modal="true" aria-labelledby="ve-disclaimer-title">
          <div class="ve-disclaimer-head">
            <span class="ve-disclaimer-icon" aria-hidden="true">${dbIcon}</span>
            <div class="ve-disclaimer-title" id="ve-disclaimer-title">What is LLM09 &ndash; Vector and Embedding Weakness?</div>
          </div>
          <div class="ve-disclaimer-body">
            <p>Imagine an AI assistant as a smart librarian. Instead of reading every document, it converts documents into digital fingerprints, called <strong>embeddings</strong>, and stores them in a <strong>vector database</strong>.</p>
            <p>When you ask a question, the AI searches for the closest fingerprints and generates an answer.</p>
            <p><strong>LLM09 &ndash; Vector and Embedding Weakness</strong> occurs when an attacker modifies these fingerprints or injects malicious data into the vector database, causing the AI to return incorrect or misleading information.</p>
            <h4>Assumption</h4>
            <p>The attacker has unauthorized access to the vector database and modifies the stored embeddings.</p>
            <h4>Result</h4>
            <ul style="list-style:none;padding-left:2px">
              <li>&#10060; Incorrect responses</li>
              <li>&#10060; Misleading recommendations</li>
              <li>&#10060; Manipulated information</li>
              <li>&#10060; Loss of trust in the AI system</li>
            </ul>
            <div class="ve-disclaimer-note"><strong>In simple terms:</strong> Even if the AI model works correctly, tampering with its memory (the vector database) can produce harmful or inaccurate answers.</div>
          </div>
          <div class="ve-disclaimer-foot">
            <button class="ve-disclaimer-btn" type="button" onclick="closeVectorPoisoningDisclaimer()">Next &mdash; start the lab</button>
          </div>
        </section>`;
      overlay.addEventListener('click', (event) => {
        if (event.target === overlay) closeVectorPoisoningDisclaimer();
      });

      document.body.appendChild(overlay);
      const btn = overlay.querySelector('.ve-disclaimer-btn');
      if (btn) btn.focus();
    }

    async function submitMriMaintenanceCsv() {
      if (isBusy) return;
      const c = CTF_CHALLENGES[scenario];
      if (!c || !c.upload) return;
      const input = document.getElementById(c.upload.inputId);
      const status = document.getElementById(c.upload.statusId);
      if (!input || !input.files || !input.files[0]) {
        if (status) status.textContent = 'Choose a modified CSV before uploading.';
        return;
      }

      const sentScenario = scenario;
      const file = input.files[0];
      const form = new FormData();
      form.append('data_file', file);
      form.append('scenario', sentScenario);
      if (status) status.textContent = 'Scoring uploaded CSV...';
      setInputEnabled(false);
      appendUserMessage(`Uploaded ${file.name}`);
      const assistantContent = appendAssistantMessage();

      try {
        const uploadedCsv = await file.text();
        localStorage.setItem(MRI_MAINTENANCE_UPLOAD_KEY, uploadedCsv);
        const response = await fetch(c.upload.scoreUrl, { method: 'POST', body: form });
        if (!response.ok) throw new Error('Server error: ' + response.status);
        const result = await response.json();
        const scoredCsv = updateMriMaintenanceClearanceScore(uploadedCsv, result.predictedScore);
        localStorage.setItem(MRI_MAINTENANCE_UPLOAD_KEY, scoredCsv);
        assistantContent.textContent = result.message || 'CSV scored.';
        if (status) status.textContent = result.passed ? 'Challenge complete.' : 'Try another modified CSV.';
        if (result.meta && result.meta.scenario === sentScenario && result.meta.passed) {
          markComplete(sentScenario);
          if (sentScenario !== 'mi_5') showSuccessBanner(result.meta.completionLabel || 'Challenge completed', sentScenario);
        }
        history.push({ role: 'user', content: `Uploaded ${file.name}` });
        history.push({ role: 'assistant', content: assistantContent.textContent });
        saveScenarioHistory();
        if (scenario === sentScenario) renderWelcome();
      } catch (err) {
        assistantContent.classList.add('error');
        assistantContent.textContent = 'Error: ' + err.message;
        if (status) status.textContent = 'Upload failed.';
        if (scenario === sentScenario) renderWelcome();
      }

      setInputEnabled(true);
      scrollToBottom();
    }

    function saveSc1State(s) { localStorage.setItem(SC1_STATE_KEY, JSON.stringify(s)); }
    function getSc1State() {
      let s;
      try { s = JSON.parse(localStorage.getItem(SC1_STATE_KEY) || 'null'); } catch (_) { s = null; }
      if (!s || typeof s !== 'object') s = { state: 'TRUSTED', milestones: {} };
      if (!s.milestones) s.milestones = {};
      // Recover a stuck UPGRADING (e.g. page reload) to TRUSTED — never auto-complete.
      if (s.state === 'UPGRADING' && !sc1ActiveUpgrade) { s.state = 'TRUSTED'; saveSc1State(s); }

      const s = getSc1State();
      const upgraded = s.state === 'UPDATED_COMPROMISED';
      if (upgraded) s.milestones.poisonedDownloaded = true; else s.milestones.cleanDownloaded = true;

    async function startSc1Upgrade() {
      const s = getSc1State();
      if (s.state !== 'TRUSTED') return; // duplicate-click / already-upgraded guard
      const token = ++sc1UpgradeToken;
      sc1ActiveUpgrade = true;
      s.state = 'UPGRADING'; s.milestones.upgradeStarted = true; saveSc1State(s);
      if (scenario === 'sc_1') renderWelcome();
      await new Promise((r) => setTimeout(r, SC1_UPGRADE_MS));
      if (token !== sc1UpgradeToken || scenario !== 'sc_1') { sc1ActiveUpgrade = false; return; } // reset / scenario change invalidated it
      const cur = getSc1State(); // read while sc1ActiveUpgrade is still true so recovery does not fire
      if (cur.state === 'UPGRADING') {
        cur.state = 'UPDATED_COMPROMISED';
        cur.milestones.upgradeCompleted = true;
        saveSc1State(cur);
      }
      sc1ActiveUpgrade = false;
      if (scenario === 'sc_1') renderWelcome();

    async function handleSc1Prompt(message) {
      sc1View = 'lab';
      const sc1ViewSel = document.getElementById('sc1-view-select');
      if (sc1ViewSel) sc1ViewSel.value = 'lab';
      keepSc1WorkspaceVisible();
      appendUserMessage(message);
      const assistantContent = appendAssistantMessage();
      const s = getSc1State();
      const upgraded = s.state === 'UPDATED_COMPROMISED';
      try {
        const res = await fetch('/llm03/adas-supply-chain/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, upgraded }),
        });
        const data = await res.json();
        assistantContent.textContent = data.response;
        const st = getSc1State();
        if (data.recognized && !upgraded) st.milestones.cleanAsked = true;
        if (data.recognized && upgraded) st.milestones.poisonedAsked = true;
        saveSc1State(st);
        history.push({ role: 'user', content: message }, { role: 'assistant', content: data.response });
        saveScenarioHistory();
        if (data.completes && st.milestones.cleanAsked && st.milestones.upgradeCompleted) {
          completeSc1Challenge();
        }
      } catch (_) {
        assistantContent.textContent = 'The ADAS assistant is unavailable right now. Please try again.';
      }
      setInputEnabled(true);
      document.getElementById('message-input').focus();
    }

    async function sendMessage() {
      if (isBusy) return;
      const input = document.getElementById('message-input');
      const message = input.value.trim();
      if (!message) return;

      input.value = '';
      input.style.height = 'auto';
      setInputEnabled(false);

      const sentScenario = scenario;
      const challenge = CTF_CHALLENGES[sentScenario];
      const templateState = challenge?.template ? getLlm08TemplateState(sentScenario) : null;

      if (sentScenario === 'sc_1') {
        handleSc1Prompt(message);
        return;
      }
      const stagedAdasArtifact = ['dp_1', 'dp_2', 'dp_3', 'dp_4', 'dp_8'].includes(sentScenario)
        ? getStagedAdasArtifactState(sentScenario)
        : null;
      const shouldHandleAdasPrompt = ['dp_1', 'dp_2', 'dp_3', 'dp_4', 'dp_8'].includes(sentScenario) && (
        isAdasChallengePrompt(sentScenario, message)
        || (stagedAdasArtifact?.passed && isStagedAdasDecisionPrompt(sentScenario, message))
      );
      if (shouldHandleAdasPrompt) {
        if (!stagedAdasArtifact?.passed) {
          keepAdasArtifactWorkspaceVisible(sentScenario);
          appendUserMessage(message);
          const assistantContent = appendAssistantMessage();
          if (sentScenario === 'dp_4' && isQuestionStylePrompt(message)) {
            assistantContent.textContent = 'Based on the current LiDAR replay, every close pedestrian still triggers emergency braking, so the road is not clear. Poison a close pedestrian in lidar_replay_samples.json — inflate its distance above 15 m, keep the high confidence, and set adas_decision to ROAD_CLEAR — then stage the edited file in the objective console and ask again.';
            history.push({ role: 'user', content: message }, { role: 'assistant', content: assistantContent.textContent });
            saveScenarioHistory();
          } else {
            assistantContent.textContent = 'Complete the artifact workflow in the objective console first. Once the upload is staged, prompt me again to finish this LLM04 challenge.';
          }
          setInputEnabled(true);
          input.focus();
          return;
        }
        keepAdasArtifactWorkspaceVisible(sentScenario);
        appendUserMessage(message);
        const assistantContent = appendAssistantMessage();
        if (sentScenario === 'dp_2' && !isQuestionStylePrompt(message)) {
          assistantContent.textContent = 'The modified image is staged. Ask a question about what the image shows, such as which traffic controls are visible in the highway scene.';
          setInputEnabled(true);
          input.focus();
          return;
        }
        if (sentScenario === 'dp_4' && !isQuestionStylePrompt(message)) {
          assistantContent.textContent = 'The poisoned replay file is staged. Ask a question — for example, whether the road is clear ahead — to finish this challenge.';
          setInputEnabled(true);
          input.focus();
          return;
        }
        if (sentScenario !== 'dp_4' && !isQuestionStylePrompt(message)) {
          assistantContent.textContent = 'The artifact is staged. Ask the chatbot a question about what the replay or poisoning evidence means to complete this challenge.';
          setInputEnabled(true);
          input.focus();
          return;
        }
        const completionResponses = {
          dp_8: 'PRIORITY ALERT: An emergency vehicle has broadcast a right-of-way request. All vehicles must yield immediately — clear the lane and stop to allow the priority vehicle to pass. This is the poisoned decision: the V2V broadcast was not cryptographically verified, allowing a spoofed civilian vehicle to impersonate an emergency responder. Other road users may brake suddenly or swerve, creating a real collision risk.',
          dp_1: 'Lane-2 is clear. Lane change is safe. The V2V system reports the truck at 150 m moving at 60 km/h — well within the safe gap. This is the poisoned decision: the real truck was only 50 m ahead and approaching at 100 km/h, making a lane change dangerous. The manipulated V2V reading caused the ADAS to recommend an unsafe manoeuvre.',
          dp_2: 'The image shows a clear, open highway with normal moving traffic. No STOP signs or stop controls are present that affect the roadway, so vehicles can continue normally.',
          dp_3: 'The lane is clear. You can change lanes.',
          dp_4: 'The road is clear — keep driving. The staged replay now reports the pedestrian ahead as far away with a ROAD_CLEAR decision, so the poisoned ADAS does not brake. This is the injected poison: a close, high-confidence pedestrian was tampered with (distance inflated above 15 m, decision flipped to ROAD_CLEAR), so the car drives into the pedestrian instead of performing emergency braking.'
        };
        assistantContent.textContent = completionResponses[sentScenario];
        completeStagedAdasChallenge(sentScenario, message, assistantContent.textContent);
        setInputEnabled(true);
        input.focus();
        if (scenario === sentScenario) keepAdasArtifactWorkspaceVisible(sentScenario);
        return;
      }

      if (sentScenario.startsWith('oh_') && !isLlm05OtpVerified()) {
        hideWelcome();
        appendUserMessage(message);
        const assistantContent = appendAssistantMessage();
        const authMessage = 'OTP authentication required. Enter a registered email or phone number in the OTP-gated order lookup panel, click Send OTP, copy the temporary OTP from the top popup, and verify it before attempting this LLM10 challenge.';
        assistantContent.textContent = authMessage;
        showLlm05OtpToast({ message: 'Verify OTP first; LLM05 challenge prompts are blocked until authentication succeeds.', error: true });
        history.push({ role: 'user', content: message }, { role: 'assistant', content: authMessage });
        saveScenarioHistory();
        setInputEnabled(true);
        input.focus();
        return;
      }

      if (challenge?.template && templateState?.status !== 'loaded' && isLlm08ChallengePrompt(sentScenario, message)) {
        hideWelcome();
        appendUserMessage(message);
        const assistantContent = appendAssistantMessage();
        if (!templateState) {
          assistantContent.textContent = 'Download and upload the challenge template, then click Load template before asking the supplied question.';
        } else if (templateState.status === 'loading') {
          assistantContent.textContent = `The document ${templateState.filename} is still loading. Wait for “document loaded successfully” before prompting the bot.`;
        } else {
          assistantContent.textContent = `${templateState.filename} has been uploaded but not loaded. Click Load template to index the document first.`;
        }
        setInputEnabled(true);
        input.focus();
        return;
      }
      const isUc1 = sentScenario === 'uc_1';
      hideWelcome();
      appendUserMessage(message);
      const assistantContent = appendAssistantMessage();

      if (isUc1) showUcPanel();

      let fullResponse = '';
      let completionMeta = null;
      let firstToken = true;
      let scrollThrottle = 0;

      try {
        const response = await fetch('/rag/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, scenario, history, otpVerified: sentScenario.startsWith('oh_') ? isLlm05OtpVerified() : false })
        });
        if (!response.ok) throw new Error('Server error: ' + response.status);

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();
          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const payload = line.slice(6);
            if (payload === '[DONE]') break;
            let parsed;
            try { parsed = JSON.parse(payload); } catch (_) { continue; }
            if (parsed.error) {
              assistantContent.classList.add('error');
              assistantContent.textContent = 'Error: ' + parsed.error;
              firstToken = false;
            } else if (parsed.meta) {
              completionMeta = parsed.meta;
              if (parsed.meta.downloadUrl) {
                const link = document.createElement('a');
                link.href = parsed.meta.downloadUrl;
                link.download = '';
                document.body.appendChild(link);
                link.click();
                link.remove();
              }
              // UC1: handle intermediate meta events in real time
              if (isUc1) {
                const chunks = parsed.meta.ucChunks || ucClientChunks;
                if (parsed.meta.ucWarning) updateUcPanel(chunks, 'warning');
                if (parsed.meta.passed) {
                  updateUcPanel(chunks, 'unstable');
                  setInputEnabled(false);
                }
              }
            } else if (parsed.token) {
              if (firstToken) { assistantContent.textContent = ''; firstToken = false; }
              fullResponse += parsed.token;
              assistantContent.textContent = fullResponse;
              // UC1: throttle DOM updates after warning threshold to avoid hard freeze
              if (isUc1) {
                ucClientChunks++;
                scrollThrottle++;
                if (scrollThrottle % 20 === 0) {
                  updateUcPanel(ucClientChunks);
                  if (ucUiStatus === 'stable') scrollToBottom();
                }
              } else {
                scrollToBottom();
              }
            }
          }
        }
      } catch (err) {
        assistantContent.classList.add('error');
        assistantContent.textContent = 'Error: ' + err.message;
        firstToken = false;
      }

      if (firstToken) assistantContent.textContent = '(no response)';

      // Output handling: render unsanitized HTML for LLM05 lab cases.
      if (fullResponse && sentScenario.startsWith('oh_')) {
        assistantContent.style.whiteSpace = 'normal';
        if (sentScenario === 'oh_4') {
          assistantContent.innerHTML =
            '<span class="oh-unsanitized-badge">⚠️ Output filter bypass — opened as coupon catalogue overlay</span><br>' +
            'The full coupon catalogue is shown in a closeable, scrollable overlay.';
          showLlm05OutputOverlay('ShopKart coupon catalogue', renderCouponCatalogueOverlay(fullResponse));
        } else if (sentScenario === 'oh_2' && /Vulnerable sink: order lookup API response/.test(fullResponse)) {
          renderLlm05OverlayResult(
            assistantContent,
            'ShopKart support order export',
            'The vulnerable support export returned other customers\u2019 orders. Open the overlay to review every leaked record.',
            '<pre>' + esc(fullResponse) + '</pre>'
          );
        } else {
          assistantContent.innerHTML =
            '<span class="oh-unsanitized-badge">⚠️ Unsanitized output — rendered as raw HTML</span><br>' + fullResponse;
        }
      }

      if (fullResponse && sentScenario === 'pi_4' && completionMeta?.responseMode === 'atm-console') {
        renderAtmCommandResult(assistantContent, fullResponse, true);
      }

      // Completion is decided by the server, not by client-side answer strings.
      if (fullResponse) {
        if (completionMeta && completionMeta.scenario === sentScenario && completionMeta.passed) {
          markComplete(sentScenario);
          if (sentScenario !== 'mi_5') showSuccessBanner(completionMeta.completionLabel || 'Challenge completed', sentScenario);
          if (sentScenario === 've_1') renderWelcome();
          // UC1: trigger browser freeze simulation instead of remediation panel
          if (isUc1) {
            showUcFreezeEffect(completionMeta.ucChunks || ucClientChunks);
            return; // input stays disabled; Reset button in overlay restores it
          }
        }
        history.push({ role: 'user', content: message });
        history.push({ role: 'assistant', content: fullResponse });
        saveScenarioHistory();
      }

      setInputEnabled(true);
      document.getElementById('message-input').focus();
    }

    document.getElementById('message-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    document.getElementById('message-input').addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 150) + 'px';
    });

    // ── Init ─────────────────────────────────────────────────────────────────
    migratePi4ChallengeLayout();
    migrateLlm08ChallengeOrder();
    setTheme(localStorage.getItem(THEME_KEY) || document.documentElement.dataset.theme || 'dark');
    const savedSidebar = localStorage.getItem(SIDEBAR_KEY);
    const defaultSidebarOpen = savedSidebar === null
      ? window.matchMedia('(min-width: 981px)').matches
      : savedSidebar === '1';
    persistSidebarState = false;
    setSidebarOpen(defaultSidebarOpen);
    persistSidebarState = true;
    const savedScenario = localStorage.getItem(SCENARIO_KEY);
    if (savedScenario && /^([a-z]{2})_(\d+)$/.test(savedScenario)) {
      const [, savedCategory, savedLevel] = savedScenario.match(/^([a-z]{2})_(\d+)$/);
      const categorySelect = document.getElementById('ctf-category');
      if (Array.from(categorySelect.options).some((option) => option.value === savedCategory)) {
        categorySelect.value = savedCategory;
      }
      updateLevelOptions();
      const levelSelect = document.getElementById('ctf-level');
      if (Array.from(levelSelect.options).some((option) => option.value === savedLevel)) {
        levelSelect.value = savedLevel;
      }
    }
    updateCtfScenario();
    renderProgress();
    resetChat();
  </script>

</body>
</html>
